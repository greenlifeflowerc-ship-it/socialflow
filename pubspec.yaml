name: socialflow
description: "AutoFlow Social Scheduler - AI-powered Instagram scheduling."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.5.1
  dio: ^5.4.3+1
  image_picker: ^1.1.2
  cached_network_image: ^3.3.1
  intl: ^0.20.2
  go_router: ^14.2.1
  flutter_secure_storage: ^9.2.2
  connectivity_plus: ^6.0.3
  url_launcher: ^6.3.0
  app_links: ^6.3.2
  table_calendar: ^3.1.2
  google_fonts: ^6.2.1
  flutter_spinkit: ^5.2.1
  logger: ^2.4.0
  android_intent_plus: ^5.0.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.3
  file_picker: ^8.1.2
  json_annotation: ^4.9.0
  supabase_flutter: ^2.5.0
  package_info_plus: ^8.0.2
  fl_chart: ^0.70.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.9
  json_serializable: ^6.8.0
  hive_generator: ^2.0.1
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/app_icon.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/icons/app_icon.png"
    background_color: "#000000"
    theme_color: "#D4AF37"
  windows:
    generate: true
    image_path: "assets/icons/app_icon.png"
    icon_size: 256

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/login_bg_mobile.jpg
    - assets/images/login_bg_desktop.jpg
    - assets/icons/
